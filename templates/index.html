<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipboard</title>
  <link rel="icon" href="/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </symbol>
  </svg>

  <div class="topbar">
    <div class="topbar-left">
      <picture>
        <source srcset="/icon-256-dark.png" media="(prefers-color-scheme: dark)">
        <img src="/icon-256-light.png" alt="Clipboard">
      </picture>
      <h1>Clipboard</h1>
    </div>
    <a class="nav-link" href="/history">History →</a>
  </div>

  <div class="card">
    <label>Push new text</label>
    <textarea id="pushText" placeholder="Paste something here..."></textarea>
    <button class="btn-push" onclick="pushClip()">Push</button>
  </div>

  <div class="current-card">
    <div class="current-card-header">
      <label>Current clipboard</label>
      <button
        class="btn-favorite {{ 'active' if current_favorite else '' }}"
        id="favoriteCurrentBtn"
        data-idx="{{ current_idx if current_idx is not none else '' }}"
        aria-label="Favorite current clipboard"
        {% if current_idx is none %}disabled{% endif %}
        onclick="toggleFavoriteCurrent()">
        <svg width="18" height="18"><use href="#icon-heart"/></svg>
      </button>
    </div>
    <div class="current-text" id="currentText">{{ current }}</div>
    <button class="btn-copy" onclick="copyToClipboard()">Copy to device clipboard</button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
